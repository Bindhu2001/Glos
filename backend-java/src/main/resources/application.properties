# Server
server.port=8081

# SQLite - points at the same data volume as the Node.js backend
spring.datasource.url=jdbc:sqlite:/data/platform.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Clerk
clerk.jwks-url=https://wired-cub-67.clerk.accounts.dev/.well-known/jwks.json
clerk.issuer=https://wired-cub-67.clerk.accounts.dev

# CORS - set to your Expo/mobile origin in production
cors.allowed-origins=*

# Tenant DB root (same as Node backend DATA_ROOT)
greatleap.data-root=/data

# Logging
logging.level.com.greatleap=INFO
logging.level.org.springframework.security=WARN
