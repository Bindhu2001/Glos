<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 900" width="430" height="900" font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000012"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0000000A"/>
    </filter>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#00000030"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
    <linearGradient id="googleGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="33%" stop-color="#34a853"/>
      <stop offset="66%" stop-color="#fbbc05"/>
      <stop offset="100%" stop-color="#ea4335"/>
    </linearGradient>
    <clipPath id="phoneClip">
      <rect x="20" y="20" width="390" height="860" rx="44"/>
    </clipPath>
    <clipPath id="screenClip">
      <rect x="26" y="26" width="378" height="848" rx="40"/>
    </clipPath>
  </defs>

  <!-- Canvas background -->
  <rect width="430" height="900" fill="url(#bgGrad)"/>

  <!-- Phone shell -->
  <rect x="20" y="20" width="390" height="860" rx="44" fill="#1a1a1a" filter="url(#phoneShadow)"/>
  <!-- Screen bezel -->
  <rect x="24" y="24" width="382" height="852" rx="42" fill="#0d0d0d"/>
  <!-- Screen -->
  <rect x="26" y="26" width="378" height="848" rx="40" fill="#f3f4f6"/>

  <!-- Side buttons -->
  <rect x="14" y="180" width="6" height="36" rx="3" fill="#2a2a2a"/>
  <rect x="14" y="230" width="6" height="60" rx="3" fill="#2a2a2a"/>
  <rect x="14" y="300" width="6" height="60" rx="3" fill="#2a2a2a"/>
  <rect x="410" y="220" width="6" height="80" rx="3" fill="#2a2a2a"/>

  <!-- Dynamic Island -->
  <rect x="158" y="36" width="114" height="28" rx="14" fill="#0d0d0d"/>

  <!-- ===== STATUS BAR ===== -->
  <g clip-path="url(#screenClip)">
    <rect x="26" y="26" width="378" height="56" fill="#ffffff"/>
    <text x="50" y="50" font-size="13" font-weight="600" fill="#111928">9:41</text>
    <!-- Signal bars -->
    <rect x="330" y="40" width="3" height="8" rx="1" fill="#111928"/>
    <rect x="335" y="36" width="3" height="12" rx="1" fill="#111928"/>
    <rect x="340" y="32" width="3" height="16" rx="1" fill="#111928"/>
    <rect x="345" y="28" width="3" height="20" rx="1" fill="#111928"/>
    <!-- WiFi -->
    <path d="M355 44 Q362 37 369 44" stroke="#111928" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M358 47.5 Q362 43 366 47.5" stroke="#111928" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="362" cy="51" r="2" fill="#111928"/>
    <!-- Battery -->
    <rect x="374" y="36" width="22" height="12" rx="3" stroke="#111928" stroke-width="1.5" fill="none"/>
    <rect x="396" y="40" width="3" height="4" rx="1" fill="#111928"/>
    <rect x="376" y="38" width="16" height="8" rx="2" fill="#111928"/>
  </g>

  <!-- ===== HEADER ===== -->
  <g clip-path="url(#screenClip)">
    <rect x="26" y="82" width="378" height="66" fill="#ffffff" filter="url(#shadow2)"/>
    <!-- Left: Title + workspace -->
    <text x="46" y="108" font-size="20" font-weight="700" fill="#111928">My Dashboard</text>
    <text x="46" y="128" font-size="13" fill="#6b7280">GreatLeap Technologies</text>
    <!-- Right: bell + swap -->
    <!-- Notification bell with badge -->
    <circle cx="350" cy="108" r="18" fill="#f3f4f6"/>
    <text x="350" y="114" font-size="17" text-anchor="middle" fill="#111928">🔔</text>
    <circle cx="362" cy="96" r="7" fill="#e02424"/>
    <text x="362" y="100" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <!-- Swap icon -->
    <circle cx="390" cy="108" r="18" fill="#f3f4f6"/>
    <text x="390" y="114" font-size="17" text-anchor="middle" fill="#6b7280">⇄</text>
  </g>

  <!-- ===== CONTENT AREA ===== -->
  <g clip-path="url(#screenClip)">
    <rect x="26" y="148" width="378" height="726" fill="#f3f4f6"/>

    <!-- SECTION LABEL: Overview -->
    <text x="46" y="176" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.8">OVERVIEW</text>

    <!-- ─── STAT CARDS ─── -->
    <!-- Card 1: My Tasks -->
    <rect x="40" y="185" width="168" height="96" rx="12" fill="#ffffff" filter="url(#shadow1)"/>
    <rect x="40" y="185" width="4" height="96" rx="2" fill="#1a56db"/>
    <rect x="52" y="195" width="34" height="34" rx="9" fill="#1a56db18"/>
    <text x="69" y="218" font-size="17" text-anchor="middle" fill="#1a56db">✓</text>
    <text x="56" y="246" font-size="22" font-weight="800" fill="#111928">12</text>
    <text x="56" y="263" font-size="11" fill="#6b7280">My Tasks</text>

    <!-- Card 2: Completed -->
    <rect x="219" y="185" width="168" height="96" rx="12" fill="#ffffff" filter="url(#shadow1)"/>
    <rect x="219" y="185" width="4" height="96" rx="2" fill="#0e9f6e"/>
    <rect x="231" y="195" width="34" height="34" rx="9" fill="#0e9f6e18"/>
    <text x="248" y="218" font-size="17" text-anchor="middle" fill="#0e9f6e">🏆</text>
    <text x="235" y="246" font-size="22" font-weight="800" fill="#111928">8</text>
    <text x="235" y="263" font-size="11" fill="#6b7280">Completed</text>

    <!-- Card 3: Goals -->
    <rect x="40" y="292" width="168" height="96" rx="12" fill="#ffffff" filter="url(#shadow1)"/>
    <rect x="40" y="292" width="4" height="96" rx="2" fill="#c27803"/>
    <rect x="52" y="302" width="34" height="34" rx="9" fill="#c2780318"/>
    <text x="69" y="325" font-size="17" text-anchor="middle" fill="#c27803">🚩</text>
    <text x="56" y="353" font-size="22" font-weight="800" fill="#111928">3</text>
    <text x="56" y="370" font-size="11" fill="#6b7280">Goals</text>

    <!-- Card 4: Time Logged -->
    <rect x="219" y="292" width="168" height="96" rx="12" fill="#ffffff" filter="url(#shadow1)"/>
    <rect x="219" y="292" width="4" height="96" rx="2" fill="#0694a2"/>
    <rect x="231" y="302" width="34" height="34" rx="9" fill="#0694a218"/>
    <text x="248" y="325" font-size="17" text-anchor="middle" fill="#0694a2">⏱</text>
    <text x="235" y="353" font-size="22" font-weight="800" fill="#111928">14h</text>
    <text x="235" y="370" font-size="11" fill="#6b7280">Time Logged</text>

    <!-- ─── RECENT TASKS ─── -->
    <text x="46" y="410" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.8">RECENT TASKS</text>
    <text x="367" y="410" font-size="13" font-weight="600" fill="#1a56db" text-anchor="end">See all</text>

    <!-- Task row 1 -->
    <rect x="40" y="420" width="347" height="48" rx="10" fill="#ffffff" filter="url(#shadow2)"/>
    <circle cx="58" cy="444" r="5" fill="#1a56db"/>
    <text x="73" y="448" font-size="14" fill="#111928">Design new onboarding flow</text>
    <text x="375" y="448" font-size="12" fill="#9ca3af" text-anchor="end">›</text>

    <!-- Task row 2 -->
    <rect x="40" y="476" width="347" height="48" rx="10" fill="#ffffff" filter="url(#shadow2)"/>
    <circle cx="58" cy="500" r="5" fill="#0e9f6e"/>
    <text x="73" y="504" font-size="14" fill="#111928">API integration for payments</text>
    <text x="375" y="504" font-size="12" fill="#9ca3af" text-anchor="end">›</text>

    <!-- Task row 3 -->
    <rect x="40" y="532" width="347" height="48" rx="10" fill="#ffffff" filter="url(#shadow2)"/>
    <circle cx="58" cy="556" r="5" fill="#1a56db"/>
    <text x="73" y="560" font-size="14" fill="#111928">Review Q2 performance goals</text>
    <text x="375" y="560" font-size="12" fill="#9ca3af" text-anchor="end">›</text>

    <!-- Task row 4 -->
    <rect x="40" y="588" width="347" height="48" rx="10" fill="#ffffff" filter="url(#shadow2)"/>
    <circle cx="58" cy="612" r="5" fill="#1a56db"/>
    <text x="73" y="616" font-size="14" fill="#111928">Update team documentation</text>
    <text x="375" y="616" font-size="12" fill="#9ca3af" text-anchor="end">›</text>

    <!-- ─── QUICK ACTIONS ─── -->
    <text x="46" y="660" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="0.8">QUICK ACTIONS</text>

    <!-- QA Card 1: New Task -->
    <rect x="40" y="669" width="76" height="76" rx="12" fill="#ffffff" filter="url(#shadow1)"/>
    <text x="78" y="697" font-size="22" text-anchor="middle" fill="#1a56db">⊕</text>
    <text x="78" y="718" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">New Task</text>
    <text x="78" y="731" font-size="9" fill="#9ca3af" text-anchor="middle"> </text>

    <!-- QA Card 2: New Post -->
    <rect x="126" y="669" width="76" height="76" rx="12" fill="#ffffff" filter="url(#shadow1)"/>
    <text x="164" y="697" font-size="22" text-anchor="middle" fill="#0e9f6e">✏</text>
    <text x="164" y="718" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">New Post</text>

    <!-- QA Card 3: Feed -->
    <rect x="212" y="669" width="76" height="76" rx="12" fill="#ffffff" filter="url(#shadow1)"/>
    <text x="250" y="697" font-size="22" text-anchor="middle" fill="#c27803">📰</text>
    <text x="250" y="718" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">Feed</text>

    <!-- QA Card 4: Profile -->
    <rect x="298" y="669" width="76" height="76" rx="12" fill="#ffffff" filter="url(#shadow1)"/>
    <text x="336" y="697" font-size="22" text-anchor="middle" fill="#0694a2">👤</text>
    <text x="336" y="718" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">Profile</text>

  </g>

  <!-- ===== BOTTOM TAB BAR ===== -->
  <g clip-path="url(#screenClip)">
    <rect x="26" y="800" width="378" height="74" fill="#ffffff"/>
    <line x1="26" y1="800" x2="404" y2="800" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Home Tab (active) -->
    <g>
      <text x="67" y="822" font-size="20" text-anchor="middle" fill="#1a56db">🏠</text>
      <text x="67" y="840" font-size="10" font-weight="600" fill="#1a56db" text-anchor="middle">Home</text>
      <rect x="55" y="844" width="24" height="3" rx="1.5" fill="#1a56db"/>
    </g>

    <!-- Tasks Tab -->
    <g>
      <text x="140" y="822" font-size="20" text-anchor="middle" fill="#9ca3af">✅</text>
      <text x="140" y="840" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Tasks</text>
    </g>

    <!-- Feed Tab -->
    <g>
      <text x="215" y="822" font-size="20" text-anchor="middle" fill="#9ca3af">📄</text>
      <text x="215" y="840" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Feed</text>
    </g>

    <!-- Performance Tab -->
    <g>
      <text x="290" y="822" font-size="20" text-anchor="middle" fill="#9ca3af">📈</text>
      <text x="290" y="840" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Performance</text>
    </g>

    <!-- Profile Tab -->
    <g>
      <text x="363" y="822" font-size="20" text-anchor="middle" fill="#9ca3af">👤</text>
      <text x="363" y="840" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Profile</text>
    </g>

    <!-- Home indicator bar -->
    <rect x="168" y="866" width="94" height="5" rx="2.5" fill="#111928" opacity="0.3"/>
  </g>

</svg>
